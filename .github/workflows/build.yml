
name: Build CEF App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (Debug/Release)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.20.x'

    - name: Download CEF
      run: |
        # 下载CEF二进制文件 (示例版本，实际需根据需求调整)
        Invoke-WebRequest -Uri "https://cef-builds.spotifycdn.com/cef_binary_109.1.11+g51392e7+chromium-109.0.5414.119_windows64_minimal.tar.bz2" -OutFile "cef.tar.bz2"
        # 解压 (需要tar命令，Windows最新 runner 支持)
        tar -xjf cef.tar.bz2
        Rename-Item -Path "cef_binary_109.1.11+g51392e7+chromium-109.0.5414.119_windows64_minimal" -NewName "cef_binary"

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} -DCEF_ROOT="${{ github.workspace }}/cef_binary"

    - name: Build
      run: |
        cmake --build build --config ${{ github.event.inputs.build_type }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CefLocalSchemeApp-${{ github.event.inputs.build_type }}
        path: build/${{ github.event.inputs.build_type }}/*
