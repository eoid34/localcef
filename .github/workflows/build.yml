name: Build CEF Local Scheme EXE

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: "CEF version (e.g. 151.3.15)"
        required: false
        default: "151.3.15"
      cef_hash:
        description: "CEF build hash (e.g. g57a32ea)"
        required: false
        default: "g57a32ea"
      cef_chromium:
        description: "Chromium version (e.g. 151.0.7922.76)"
        required: false
        default: "151.0.7922.76"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CEF binary
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.cef_version }}"
          $hash = "${{ github.event.inputs.cef_hash }}"
          $chromium = "${{ github.event.inputs.cef_chromium }}"
          $url = "https://cef-builds.spotifycdn.com/cef_binary_${ver}%2B${hash}%2Bchromium-${chromium}_windows64.tar.bz2"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile cef.tar.bz2
          tar -xf cef.tar.bz2
          $dir = Get-ChildItem -Directory cef_binary_* | Select-Object -First 1
          Remove-Item cef_binary -Recurse -Force -ErrorAction SilentlyContinue
          Move-Item $dir.FullName cef_binary -Force
          Write-Host "CEF extracted to ./cef_binary"

      # Configure + Build with Ninja and the MSVC toolchain.
      # We locate the MSVC environment via vswhere (no dependency on the
      # "Visual Studio 17 2022" CMake generator, which may be unavailable).
      - name: Configure and Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCEF_DIR="${{ github.workspace }}\cef_binary"
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cef-local-scheme-exe
          path: build/
